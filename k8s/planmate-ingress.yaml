apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: planmate-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "1024m"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "route"
    nginx.ingress.kubernetes.io/session-cookie-hash: "sha1"
spec:
  tls:
  - hosts:
    - minio.salmakis.cloud
    - redis.salmakis.cloud
    - db.salmakis.cloud
    - kibana.salmakis.cloud
    secretName: planmate-backend-tls
  rules:
  - host: kibana.salmakis.cloud
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kibana-kb-http
            port:
              number: 5601
  - host: redis.salmakis.cloud
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: redisinsight-service
            port:
              number: 80
  - host: db.salmakis.cloud
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pgadmin-service
            port:
              number: 80
  # pmserver1.salmakis.cloud 는 planmate 네임스페이스의 새 스택(planmate-v2-ingress)이
  # 받는다. Ingress 는 다른 네임스페이스의 서비스를 가리킬 수 없어 규칙째 옮겼다.
  # 구 모놀리스(planmate-backend-service)는 그대로 떠 있으므로, 되돌리려면 이 블록을
  # 복원하고 deploy 레포 쪽 규칙을 지우면 된다.
  - host: minio.salmakis.cloud
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: myminio-console
            port:
              number: 9090